<path d="M560,387 L618,387" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round"  marker-end="url(#a-1baf7a)"/>
<path d="M760,74 L798,74" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"  marker-end="url(#a-2a78d6)"/>
<path d="M760,127 L798,127" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"  marker-end="url(#a-2a78d6)"/>
<path d="M760,276 L798,276" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round"  marker-end="url(#a-eb6834)"/>
<path d="M760,387 L798,387" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round"  marker-end="url(#a-1baf7a)"/>
<path d="M430,146 L430,234" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"  marker-end="url(#a-2a78d6)"/>
<text x="440" y="176" class="n">mass</text>
