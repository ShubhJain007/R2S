<circle cx="618" cy="200" r="10" fill="#f6f8fa" stroke="#d03b3b" stroke-width="1.5"/><path d="M613,195 L623,205 M623,195 L613,205" stroke="#d03b3b" stroke-width="2" stroke-linecap="round"/><text x="704" y="226" class="n" text-anchor="end">inertia from motion: 300&#8211;800% error, not used</text>
</svg>
